# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name webapp4.com *.webapp4.com;

    return 301 https://$host$request_uri;
}

# HTTPS wildcard site hosting
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ~^(?<project>.+)\.webapp4\.com$ webapp4.com;

    ssl_certificate     /etc/letsencrypt/live/webapp4.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webapp4.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/sites/$project;
    index index.html index.htm index.php;

    access_log /var/log/nginx/webapp4-access.log;
    error_log  /var/log/nginx/webapp4-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}

# Main domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name webapp4.com;

    ssl_certificate     /etc/letsencrypt/live/webapp4.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webapp4.com/privkey.pem;

    root /var/www/sites/main;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
